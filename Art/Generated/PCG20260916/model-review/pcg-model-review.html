  const preview = root.querySelector('[data-preview]');
  const detail = root.querySelector('[data-detail]');
  const modelButtons = [...root.querySelectorAll('[data-model]')];
  const viewButtons = [...root.querySelectorAll('[data-view]')];
  let modelIndex = 0;
  let viewIndex = 0;
  function render() {
    const model = models[modelIndex];
    preview.src = model.views[viewIndex];
    preview.alt = `${model.name}，角度${viewIndex + 1}，原始模型实际渲染`;
    detail.textContent = `${model.name} · ${model.textured ? '已带材质' : '仅白模，未上材质'} · ${model.triangles.toLocaleString('zh-CN')} 三角面`;
    modelButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(index === modelIndex)));
    viewButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(index === viewIndex)));
  }
  modelButtons.forEach(button => button.addEventListener('click', () => {
    modelIndex = Number(button.dataset.model);
    render();
  }));
  viewButtons.forEach(button => button.addEventListener('click', () => {
    viewIndex = Number(button.dataset.view);
    render();
  }));
  render();
})();
