name: Windows technical preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'game/**'
      - 'third_party/**'
      - 'distribution/**'
      - 'tools/build_windows_preview.py'
      - 'tools/verify_windows_preview.py'
      - 'Build-WindowsPreview.ps1'
      - '.github/workflows/windows-preview.yml'

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.200'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - uses: chickensoft-games/setup-godot@46198e5e97e81c09d8001962fdf4ed8c215bcb50 # v2.1.1
        with:
          version: '4.7.2'
          use-dotnet: true
          include-templates: true
      - name: Verify LFS source objects
        run: git lfs fsck
      - name: Build and verify isolated offline package
        shell: pwsh
        run: ./Build-WindowsPreview.ps1 -Godot (Get-Command godot).Source
      # No release publication or artifact upload before the rights/release gate.
